<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzes | WTP</title>
<style>
:root { --navy:#0A285F; --red:#B22234; --gold:#D4AF37; --green:#27ae60; }
body { margin:0; font-family:'Segoe UI',sans-serif; background:#f0f4f8; min-height:100vh; }
header { background:var(--navy); padding:1.2rem 5%; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:4px solid var(--gold); color:white; }
.logo { font-weight:900; text-transform:uppercase; letter-spacing:2px; }
nav a { color:white; text-decoration:none; margin-left:20px; font-size:0.9rem; font-family:sans-serif; }
nav a:hover, nav a[href="quizzes.html"] { color:var(--gold); }
.container { max-width:900px; margin:30px auto; width:90%; }
.selector-box { background:var(--navy); padding:25px; border-radius:15px; margin-bottom:20px; display:grid; grid-template-columns:1fr 1fr auto; gap:15px; align-items:end; box-shadow:0 8px 20px rgba(0,0,0,0.15); }
.selector-box label { color:var(--gold); font-size:0.7rem; font-weight:800; display:block; margin-bottom:8px; text-transform:uppercase; }
select { background:rgba(255,255,255,0.15); border:2px solid var(--gold); color:white; padding:12px; border-radius:8px; width:100%; cursor:pointer; font-size:1rem; font-weight:bold; }
select option { color:black; }
.btn { background:var(--gold); color:var(--navy); border:none; padding:14px 24px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.btn.red { background:var(--red); color:white; }
#record { text-align:center; color:var(--navy); font-weight:bold; margin-bottom:20px; }
#quiz { background:white; border-radius:20px; padding:35px; box-shadow:0 15px 40px rgba(0,0,0,0.1); text-align:center; }
.bar { height:10px; background:#e1e8ed; border-radius:10px; overflow:hidden; margin:10px 0 25px; }
.bar div { height:100%; background:var(--navy); width:0; transition:width 0.3s; }
.display-box { background:#f8fafc; padding:25px; border-radius:15px; margin:15px 0; font-size:1.2rem; font-weight:bold; border:2px solid var(--navy); color:var(--navy); }
.opts { display:flex; flex-direction:column; gap:12px; margin-top:20px; }
.opt { padding:16px; border-radius:10px; border:2px solid #e1e8ed; background:white; cursor:pointer; font-weight:600; text-align:left; font-size:0.95rem; transition:0.2s; }
.opt:hover { background:#f0f4f8; border-color:var(--gold); }
.opt.sel { border-color:var(--navy); background:#e8eef8; }
.nav-row { margin-top:25px; text-align:right; }
.score { font-size:3rem; font-weight:900; color:var(--navy); margin:10px 0; }
.review { text-align:left; background:#f8fafc; border-left:5px solid var(--red); border-radius:8px; padding:14px; margin:12px 0; }
.review b { color:var(--navy); }
.good { color:var(--green); font-weight:bold; }
.bad { color:var(--red); font-weight:bold; }
@media (max-width:700px) { .selector-box { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo">We The People</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="team.html">Team Members</a>
    <a href="practice.html">Practice Sets</a>
    <a href="evidence.html">Evidence Charts</a>
    <a href="flashcards.html">Flashcards</a>
    <a href="quizzes.html">Quizzes</a>
    <a href="about.html">About</a>
  </nav>
</header>
<div class="container">
  <div class="selector-box">
    <div><label>Member</label>
      <select id="member" onchange="resetQuiz()">
        <option value="Josue">Josue</option><option value="Emmalie">Emmalie</option>
        <option value="Brooks">Brooks</option><option value="Naomi">Naomi</option>
      </select></div>
    <div><label>Unit Question</label>
      <select id="qsel" onchange="resetQuiz()">
        <option value="Q1">Question 1</option><option value="Q2">Question 2</option><option value="Q3">Question 3</option>
      </select></div>
    <button class="btn" onclick="startQuiz()">Start Quiz</button>
  </div>
  <div id="record"></div>
  <div id="quiz"><p>Pick a member and a question, then press Start Quiz.</p></div>
</div>
<script>
const DATA = {"Q1": [{"t": "Democracy in America (Vol. 1)", "d": "Tocqueville (1835): the majority fences in opinion, and dissenters are punished socially, not legally. He found 'little independence of mind' in America.", "o": ["Brooks", "Naomi"]}, {"t": "Tyranny of the Majority", "d": "Tocqueville's core fear: social pressure and fear of disapproval, not force, make minorities censor themselves and conform.", "o": ["Naomi"]}, {"t": "Soft Despotism", "d": "Tocqueville (Vol. 2, 1840): a gentle, paternalistic state that smothers initiative with comfort and regulation. This is a separate danger from majority pressure.", "o": ["Brooks"]}, {"t": "Popular Sovereignty", "d": "Rule by the people's consent; Tocqueville warned it makes the majority seem always right, leaving dissent little moral standing.", "o": ["Josue"]}, {"t": "Infallibility Complex", "d": "The belief that a ruling majority or government cannot err; it turns dissent into wrongdoing rather than disagreement.", "o": ["Emmalie"]}, {"t": "Spiral of Silence", "d": "A theory that people who think their view is unpopular stay quiet, so it looks even less popular. It is social control without any law.", "o": ["Brooks"]}, {"t": "Federalist 51", "d": "Madison: separated powers and a large, varied republic make it hard for a tyrannical majority to form. Structure checks government, not neighbors.", "o": ["Emmalie"]}, {"t": "Spirit of the Laws (1748)", "d": "Montesquieu: liberty is security of mind, so no one need fear another. Tocqueville applied this to fear of the majority.", "o": ["Josue"]}, {"t": "Institutional Safeguards", "d": "Bill of Rights, judicial review, and the Senate restrain majorities. Tocqueville added juries, local government, and a free press.", "o": ["Brooks"]}, {"t": "Tocqueville on the Press", "d": "Tocqueville argued there is no middle ground between a free press and servitude; a democracy must accept press excesses to keep liberty.", "o": ["Emmalie"]}, {"t": "First Amendment (Heritage)", "d": "Bars Congress from abridging speech, press, assembly, or petition. It limits government, so it cannot directly stop social pressure.", "o": ["Brooks"]}, {"t": "Floyd Abrams: Speaking Freely", "d": "Documentary on the First Amendment lawyer who helped represent the NYT in the Pentagon Papers case; shows speech is protected from government, not from public backlash.", "o": ["Brooks"]}, {"t": "Licensing Act of 1662", "d": "An English law requiring licenses to print, a form of state censorship and the older danger. Tocqueville argued democratic majorities can silence dissent without a censor.", "o": ["Brooks"]}, {"t": "Tocqueville and Partisanship", "d": "Tocqueville warned republican principles could perish only after a long period of social upheaval; the article applies this to today's polarization.", "o": ["Brooks"]}, {"t": "Federalist 10", "d": "Madison: a large republic with many interests keeps any one faction, including a majority, from controlling government.", "o": []}, {"t": "The Liberator (1831)", "d": "Garrison's newspaper demanding immediate abolition of slavery; a Boston mob nearly lynched him in 1835. The press let a hated minority view reach the public.", "o": ["Naomi"]}, {"t": "The North Star (1847)", "d": "Frederick Douglass, formerly enslaved, used his paper to attack slavery and press for equality for Black Americans and women.", "o": ["Naomi"]}, {"t": "Pennsylvania Hall (1838)", "d": "An abolitionist hall in Philadelphia was burned by a mob on May 17, 1838, days after opening. No law was used; the majority silenced dissent by force.", "o": ["Josue"]}, {"t": "Congressional Gag Rule", "d": "House rule (1836 to 1844) tabling antislavery petitions without debate; John Quincy Adams fought it as a violation of the right to petition.", "o": ["Naomi"]}, {"t": "Seneca Falls (1848)", "d": "Declaration of Sentiments demanded women's rights, including the vote, against a majority that excluded women from politics.", "o": ["Naomi"]}, {"t": "Susan B. Anthony", "d": "Voted in 1872 and was arrested, tried, and fined $100. She used her trial to challenge the exclusion of women from voting.", "o": ["Naomi"]}, {"t": "Alien and Sedition Acts (1798)", "d": "The Federalist majority in Congress made criticizing the government a crime, and prosecutions mostly targeted opposition editors.", "o": ["Emmalie"]}, {"t": "Sedition Act (1918)", "d": "Added to the 1917 Espionage Act; criminalized 'disloyal' or abusive speech about the government and military during World War I.", "o": ["Josue"]}, {"t": "Debs v. United States", "d": "1919: the Court unanimously upheld Debs's sentence of ten years for an antiwar speech, in a wartime climate of intolerance.", "o": ["Brooks"]}, {"t": "Jim Crow Era", "d": "Legislatures controlled by white voters passed segregation laws, poll taxes, and literacy tests: majority rule used to silence a minority's vote.", "o": ["Brooks"]}, {"t": "Drum Major Instinct (MLK)", "d": "King's 1968 sermon: craving the crowd's approval keeps people from standing for justice; he urged conscience over popularity.", "o": ["Emmalie"]}, {"t": "Hays Code", "d": "Hollywood's censorship code, set by the industry itself (written 1930, enforced 1934 to 1968), barred content outside majority norms, such as interracial romance.", "o": ["Emmalie"]}, {"t": "Labor Rights Advocacy", "d": "Workers organizing for fair pay and safety faced firings, injunctions, and violence until the Wagner Act (1935) protected unions.", "o": ["Emmalie"]}, {"t": "Karen Silkwood", "d": "1974: a plutonium plant worker reported safety violations to regulators, then died in a disputed car crash.", "o": ["Emmalie"]}, {"t": "Silent Spring (1962)", "d": "Rachel Carson challenged pesticide use, drew attacks from the chemical industry, and shifted public opinion.", "o": ["Naomi"]}, {"t": "Tinker v. Des Moines", "d": "1969: students suspended for wearing armbands protesting the Vietnam War won; students do not shed their speech rights at the schoolhouse gate.", "o": ["Naomi"]}, {"t": "Pentagon Papers (1971)", "d": "Ellsberg leaked a secret Vietnam study showing government deception; he was charged under the Espionage Act, but the case was dismissed in 1973.", "o": ["Josue"]}, {"t": "NYT v. United States", "d": "In 1971 the Court ruled 6 to 3 that the government could not block publication of the Pentagon Papers, citing a 'heavy presumption' against prior restraint. Courts can check the government.", "o": ["Naomi"]}, {"t": "Edward Snowden (2013)", "d": "Leaked details of NSA mass surveillance programs; in 2020 a federal appeals court ruled the bulk phone collection program unlawful.", "o": ["Emmalie"]}, {"t": "Twitter v. Taamneh", "d": "2023: the Court unanimously held that platforms hosting and recommending content were not liable for aiding an ISIS attack.", "o": ["Josue"]}, {"t": "Lindke v. Freed", "d": "2024: officials violate the First Amendment by blocking critics only if they had authority to speak for the state and used that authority in the post.", "o": ["Josue"]}, {"t": "Jawboning", "d": "Officials pressure private platforms to remove speech without passing a law, so censorship looks like a voluntary business decision.", "o": ["Josue"]}, {"t": "Cancel Culture", "d": "Online backlash punishes unpopular views through social cost; critics see Tocqueville's social tyranny, defenders see accountability.", "o": ["Josue"]}, {"t": "Soft Tyranny / Illiberal Democracy", "d": "Elections continue while liberties erode. Russia's 'foreign agent' laws restrict NGOs and media through labels, fines, and closures.", "o": ["Josue"]}, {"t": "Trump Administration Media Ban", "d": "September 2026: the administration banned CNN, MS NOW, and Politico from White House grounds, citing national security. The outlets sued, claiming a First Amendment violation.", "o": ["Emmalie"]}, {"t": "Pew: Censorship of News", "d": "Only 36% say people who share their political views are extremely or very free to speak openly; 76% say social media companies at least sometimes keep important news from them.", "o": ["Josue"]}], "Q2": [], "Q3": []};
const box = document.getElementById('quiz');
let qs = [], idx = 0, picked = null, answers = [], startTime = Date.now();

function shuffle(a) { return a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]); }
function readTeamStats(m) {
  try { return JSON.parse(localStorage.getItem('stats_' + m)) || {}; } catch (e) { return {}; }
}
function saveTeamStats(m, qn, score, total, streak) {
  const n = qn.slice(1), s = readTeamStats(m);
  ['correct', 'attempted', 'bestStreak', 'minutesStudied', 'q1correct', 'q1attempted', 'q2correct', 'q2attempted', 'q3correct', 'q3attempted']
    .forEach(k => { s[k] = s[k] || 0; });
  s.correct += score; s.attempted += total;
  s['q' + n + 'correct'] += score; s['q' + n + 'attempted'] += total;
  s.bestStreak = Math.max(s.bestStreak, streak);
  s.minutesStudied += Math.max(1, Math.round((Date.now() - startTime) / 60000));
  try { localStorage.setItem('stats_' + m, JSON.stringify(s)); } catch (e) {}
}
function showRecord() {
  const m = document.getElementById('member').value, n = document.getElementById('qsel').value.slice(1), s = readTeamStats(m);
  const c = s['q' + n + 'correct'] || 0, a = s['q' + n + 'attempted'] || 0;
  document.getElementById('record').innerText = a
    ? m + ' on Question ' + n + ': ' + c + ' correct out of ' + a + ' answered (' + Math.round(c / a * 100) + '% accuracy)'
    : 'No answers yet for this set.';
}
function resetQuiz() { box.innerHTML = '<p>Pick a member and a question, then press Start Quiz.</p>'; showRecord(); }

function pool() {
  const m = document.getElementById('member').value, all = DATA[document.getElementById('qsel').value];
  return all.filter(i => i.o.includes(m));
}
function startQuiz() {
  const p = pool();
  if (!p.length) { box.innerHTML = '<p>This question is not ready yet. Check back soon!</p>'; return; }
  qs = shuffle(p).map(item => {
    const byTitle = Math.random() < 0.5, key = byTitle ? 't' : 'd', other = byTitle ? 'd' : 't';
    const wrong = shuffle(p.filter(x => x[key] !== item[key])).slice(0, 3).map(x => x[key]);
    return {prompt: byTitle ? 'Which evidence does this describe?' : 'Which description matches this evidence?',
            shown: item[other], title: item.t, correct: item[key], opts: shuffle([item[key], ...wrong])};
  });
  idx = 0; answers = []; picked = null; startTime = Date.now(); render();
}
function render() {
  const q = qs[idx];
  box.innerHTML = '';
  const meta = document.createElement('div'); meta.style.fontWeight = 'bold'; meta.innerText = 'Question ' + (idx + 1) + ' of ' + qs.length;
  const bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = '<div style="width:' + (idx / qs.length * 100) + '%"></div>';
  const pr = document.createElement('p'); pr.innerText = q.prompt;
  const db = document.createElement('div'); db.className = 'display-box'; db.innerText = q.shown;
  const opts = document.createElement('div'); opts.className = 'opts';
  q.opts.forEach(o => {
    const b = document.createElement('button'); b.className = 'opt'; b.innerText = o;
    b.onclick = () => { picked = o; opts.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); next.disabled = false; };
    opts.appendChild(b);
  });
  const row = document.createElement('div'); row.className = 'nav-row';
  const next = document.createElement('button'); next.className = 'btn'; next.disabled = true;
  next.innerText = idx === qs.length - 1 ? 'Finish' : 'Next';
  next.onclick = () => { answers.push(picked); picked = null; idx++; idx < qs.length ? render() : finish(); };
  row.appendChild(next);
  [meta, bar, pr, db, opts, row].forEach(e => box.appendChild(e));
}
function finish() {
  const m = document.getElementById('member').value, qn = document.getElementById('qsel').value;
  const score = qs.filter((q, i) => answers[i] === q.correct).length, pct = Math.round(score / qs.length * 100);
  let run = 0, streak = 0;
  qs.forEach((q, i) => { if (answers[i] === q.correct) { run++; streak = Math.max(streak, run); } else run = 0; });
  saveTeamStats(m, qn, score, qs.length, streak); showRecord();
  box.innerHTML = '<h2>Quiz Complete</h2><div class="score">' + score + ' / ' + qs.length + ' (' + pct + '%)</div>'
    + '<p>' + (pct === 100 ? 'Perfect score! 🎉' : pct >= 80 ? 'Great work!' : 'Keep practicing, you will get there!') + '</p>';
  const missed = qs.map((q, i) => ({q, a: answers[i]})).filter(x => x.a !== x.q.correct);
  if (missed.length) {
    const h = document.createElement('h3'); h.innerText = 'Review Your Misses'; box.appendChild(h);
    missed.forEach(x => {
      const r = document.createElement('div'); r.className = 'review';
      r.innerHTML = '<b></b><br>Your answer: <span class="bad"></span><br>Correct: <span class="good"></span>';
      r.querySelector('b').innerText = x.q.title;
      r.querySelector('.bad').innerText = x.a; r.querySelector('.good').innerText = x.q.correct;
      box.appendChild(r);
    });
  }
  const row = document.createElement('div'); row.className = 'nav-row';
  const again = document.createElement('button'); again.className = 'btn red'; again.innerText = 'Retake Quiz'; again.onclick = startQuiz;
  row.appendChild(again); box.appendChild(row);
}
const urlM = new URLSearchParams(location.search).get('member');
if (urlM && [...document.getElementById('member').options].some(o => o.value === urlM)) document.getElementById('member').value = urlM;
showRecord();
</script>
</body>
</html>
